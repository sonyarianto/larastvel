name: Publish to crates.io

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — package and verify each crate without uploading"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Verify tag matches crate versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for f in Cargo.toml crates/*/Cargo.toml; do
            VER="$(grep -m1 '^version' "$f" | sed 's/version = "\(.*\)"/\1/')"
            if [ "$VER" != "$TAG" ]; then
              echo "::error::Version mismatch: $f is $VER but tag is v$TAG"
              exit 1
            fi
          done
          echo "All crates are at v$TAG"

      # Dependency order: larastvel-macros -> larastvel-core ->
      # larastvel-testing / larastvel-tinker / larastvel-cli -> larastvel-new.
      # Idempotent: crates already at the tagged version are skipped, so a
      # re-run after a partial failure can resume where it left off.
      - name: Publish crates (dependency order)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for p in larastvel-macros larastvel-core larastvel-testing larastvel-tinker larastvel-cli larastvel-new; do
            PUBLISHED="$(curl -s -H "User-Agent: larastvel-release" "https://crates.io/api/v1/crates/$p" | python3 -c 'import json,sys; print(json.load(sys.stdin)["crate"]["max_version"])' 2>/dev/null)"
            if [ "$PUBLISHED" = "$VERSION" ]; then
              echo "::notice::$p is already at v$VERSION — skipping"
              continue
            fi
            echo "Publishing $p ..."
            cargo publish -p "$p" || exit 1
          done

  dry-run:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Dry-run publish all crates (order matters)
        run: |
          for p in larastvel-macros larastvel-core larastvel-testing larastvel-tinker larastvel-cli larastvel-new; do
            cargo publish -p "$p" --dry-run --no-verify || exit 1
          done
