pre-commit:
  parallel: true
  commands:
    fmt:
      glob: "*.rs"
      run: cargo fmt
      stage_fixed: true
    clippy:
      glob: "*.rs"
      run: cargo clippy --workspace --all-targets -- -D warnings
    check:
      glob: "*.rs"
      run: cargo check --workspace

pre-push:
  commands:
    parity:
      # Informational drift report; use --strict (or the parity-audit
      # workflow with strict=true) before a release.
      run: bash scripts/parity-audit.sh

